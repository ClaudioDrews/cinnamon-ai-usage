name: CI

# O que roda aqui é o que roda nesta máquina: a suíte nos dois idiomas, o JavaScript, a
# compilação do backend e o pacote do Spices conferido pelo validador oficial. Duas
# verificações ficam de fora por dependerem da máquina — `cjs tests/check_cjs_api.js`, que
# precisa dos typelibs do Cinnamon/Muffin, e `tests/smoke_gtk.py`, que precisa de sessão
# gráfica. Elas continuam sendo o que se roda antes de publicar.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      # v5 é a que roda em Node 24: a v4 fica na Node 20, que o GitHub desativou.
      - uses: actions/checkout@v5

      # librsvg2-bin dá o rsvg-convert que o pacote usa para o ícone; python3-pil é exigência
      # do validate-spice; gettext dá o msgfmt/xgettext que ele também chama; e as ligações GTK
      # (mais o cofre) são o que o applet declara precisar — sem gir1.2-gtk-3.0 os testes das
      # janelas nem carregam.
      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext librsvg2-bin python3-pil \
            python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-secret-1

      - name: Suíte (inglês)
        run: python3 -m unittest discover -s tests -v

      - name: Suíte (português)
        env:
          LANGUAGE: pt_BR.UTF-8
        run: python3 -m unittest discover -s tests

      - name: JavaScript
        run: |
          node --check applet/applet.js
          node tests/test_applet.js

      - name: Compilação do backend
        run: python3 -m compileall -q backend

      - name: Pacote do Spices, com o validador oficial
        run: |
          curl -sSLo validate-spice \
            https://raw.githubusercontent.com/linuxmint/cinnamon-spices-applets/master/validate-spice
          PYTHON=python3 VALIDATE_SPICE="$PWD/validate-spice" sh scripts/spices.sh
